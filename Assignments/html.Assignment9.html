<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Selectors Example</title>

    <style>
        /* Element selector */
        p {
            color: #555;
            line-height: 1.6;
        }

        /* Class selector */
        .intro {
            font-style: italic;
        }

        /* Class selector */
        .highlight {
            background-color: #f0f8ff;
            padding: 8px;
        }

        /* ID selector */
        #header {
            color: #2c3e50;
            font-size: 32px;
        }

        /* Class selector */
        .box {
            border: 1px solid #ccc;
            padding: 16px;
        }
    </style>
</head>

<body>

    <h1 id="header">Welcome to My Page</h1>

    <p class="intro">
        This is an introductory paragraph.
    </p>

    <p>
        This is a normal paragraph.
    </p>

    <p class="highlight">
        This paragraph is highlighted.
    </p>

    <div class="box">
        <p>This content is inside a box.</p>
    </div>

</body>
</html>
