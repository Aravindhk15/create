


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Variables and Operators</title>
</head>
<body>

    <h1>JavaScript Variables & Operators</h1>

    <script>

        // 1. Declare variables using var, let and const

        var name = "Aravindh";
        let age = 23;
        const country = "India";

        console.log("Name:", name);
        console.log("Age:", age);
        console.log("Country:", country);


        // 2. Different JavaScript Data Types

        let studentName = "Aravindh";  // String
        let marks = 85;                // Number
        let isStudent = true;          // Boolean
        let address = null;            // Null
        let phoneNumber;               // Undefined

        console.log("String:", studentName);
        console.log("Number:", marks);
        console.log("Boolean:", isStudent);
        console.log("Null:", address);
        console.log("Undefined:", phoneNumber);


        // 3. JavaScript Operators

        let a = 20;
        let b = 5;

        // Arithmetic Operators
        console.log("Addition:", a + b);
        console.log("Subtraction:", a - b);
        console.log("Multiplication:", a * b);
        console.log("Division:", a / b);
        console.log("Modulus:", a % b);


        // Comparison Operators
        console.log("Equal (==):", a == "20");
        console.log("Strict Equal (===):", a === "20");


        // Logical Operators
        let x = true;
        let y = false;

        console.log("AND (&&):", x && y);
        console.log("OR (||):", x || y);

    </script>

</body>
</html>
